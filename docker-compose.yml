services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ordersUser
      POSTGRES_PASSWORD: ordersPw
      POSTGRES_DB: ordersDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordersUser -d ordersDb"]
      interval: 2s
      timeout: 3s
      retries: 30

  order-service:
    build: ./order-service
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://ordersUser:ordersPw@db:5432/ordersDb
      LOG_REQUESTS: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  order-generator:
    build: ./order-generator
    environment:
      ORDER_SERVICE_URL: http://order-service:3000
      CREATE_ORDERS: ${CREATE_ORDERS:-false}
      CREATE_INTERVAL_MS: "5000"
      UPDATE_INTERVAL_MS: "1500"
      CANCEL_PROBABILITY: "0.05"
    depends_on:
      order-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      order-service:
        condition: service_healthy

volumes:
  pgdata:
